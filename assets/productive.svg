<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180" role="img" aria-label="When I commit (JST)">
  <defs>
    <clipPath id="pc-clip"><rect width="360" height="180" rx="16"/></clipPath>
    <radialGradient id="pc-pink"><stop offset="0" stop-color="#de5b94" stop-opacity="0.22"/><stop offset="1" stop-color="#de5b94" stop-opacity="0"/></radialGradient>
    <radialGradient id="pc-blue"><stop offset="0" stop-color="#3fb4d8" stop-opacity="0.18"/><stop offset="1" stop-color="#3fb4d8" stop-opacity="0"/></radialGradient>
    <linearGradient id="pc-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.4"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#pc-clip)">
    <rect width="360" height="180" fill="#1b1923"/>
    <circle cx="320" cy="20" r="150" fill="url(#pc-pink)"><animateTransform attributeName="transform" type="translate" values="0 0;-60 60;0 0" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></circle>
    <circle cx="30" cy="180" r="130" fill="url(#pc-blue)"><animateTransform attributeName="transform" type="translate" values="0 0;50 -45;0 0" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></circle>
    <circle cx="40" cy="174" r="1.6" fill="#3fb4d8" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;12 -150" dur="9s" begin="0s" repeatCount="indefinite"/></circle><circle cx="96" cy="174" r="2.2" fill="#de5b94" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-10 -150" dur="11s" begin="3s" repeatCount="indefinite"/></circle><circle cx="150" cy="174" r="1.3" fill="#c9c3e6" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="5.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;8 -150" dur="8s" begin="5.5s" repeatCount="indefinite"/></circle><circle cx="212" cy="174" r="1.8" fill="#3fb4d8" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="1.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-14 -150" dur="10s" begin="1.5s" repeatCount="indefinite"/></circle><circle cx="268" cy="174" r="2.4" fill="#de5b94" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="12s" begin="6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;10 -150" dur="12s" begin="6s" repeatCount="indefinite"/></circle><circle cx="318" cy="174" r="1.4" fill="#c9c3e6" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="2.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-8 -150" dur="9s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans JP&quot;, Helvetica, Arial, sans-serif">
  <!-- clock: minute hand laps every 4s, hour hand every 48s -->
  <g transform="translate(32,33)" fill="none" stroke="#c9c3e6" stroke-linecap="round">
    <circle r="8" stroke-width="1.6"/>
    <path d="M0 0 V-5.5" stroke-width="1.6"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite"/></path>
    <path d="M0 0 H3.5" stroke-width="1.8"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="48s" repeatCount="indefinite"/></path>
  </g>
  <text x="48" y="38" font-size="16" font-weight="700" fill="#f3ece8">When I commit</text>
  <text x="336" y="38" font-size="10" text-anchor="end" fill="#8a86a3">JST · last 10 events</text>

  <g transform="translate(0,58)">
    <text x="24" y="10" font-size="12" font-weight="600" fill="#f3ece8">Morning</text>
    <text x="84" y="10" font-size="10" fill="#8a86a3">06–12</text>
    <rect x="130" y="0" width="150" height="10" rx="5" fill="#2a2836"/>
    <rect x="130" y="0" width="0" height="10" rx="5" fill="#e2b25a">
      <animate attributeName="width" values="0;150" dur="0.9s" begin="0.20s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    </rect>
    <clipPath id="bar0"><rect x="130" y="0" width="150" height="10" rx="5"/></clipPath>
    <g clip-path="url(#bar0)"><rect x="90" y="0" width="40" height="10" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" values="0 0;190 0;190 0" keyTimes="0;0.2;1" dur="9s" begin="1.4s" repeatCount="indefinite"/>
    </rect></g>
    <text x="336" y="10" font-size="11" font-weight="600" text-anchor="end" fill="#f3ece8">5<tspan fill="#8a86a3" font-weight="400" dx="5">50%</tspan></text>
  </g>
  <g transform="translate(0,82)">
    <circle cx="15" cy="6" r="2.5" fill="#3fb4d8"/>
    <text x="24" y="10" font-size="12" font-weight="600" fill="#f3ece8">Daytime</text>
    <text x="84" y="10" font-size="10" fill="#8a86a3">12–18</text>
    <rect x="130" y="0" width="150" height="10" rx="5" fill="#2a2836"/>
    <rect x="130" y="0" width="0" height="10" rx="5" fill="#3fb4d8">
      <animate attributeName="width" values="0;30" dur="0.9s" begin="0.29s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    </rect>
    <clipPath id="bar1"><rect x="130" y="0" width="30" height="10" rx="5"/></clipPath>
    <g clip-path="url(#bar1)"><rect x="90" y="0" width="40" height="10" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" values="0 0;70 0;70 0" keyTimes="0;0.2;1" dur="9s" begin="2.0s" repeatCount="indefinite"/>
    </rect></g>
    <text x="336" y="10" font-size="11" font-weight="600" text-anchor="end" fill="#f3ece8">1<tspan fill="#8a86a3" font-weight="400" dx="5">10%</tspan></text>
  </g>
  <g transform="translate(0,106)">
    <text x="24" y="10" font-size="12" font-weight="600" fill="#f3ece8">Evening</text>
    <text x="84" y="10" font-size="10" fill="#8a86a3">18–24</text>
    <rect x="130" y="0" width="150" height="10" rx="5" fill="#2a2836"/>
    <rect x="130" y="0" width="0" height="10" rx="5" fill="#de5b94">
      <animate attributeName="width" values="0;120" dur="0.9s" begin="0.38s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    </rect>
    <clipPath id="bar2"><rect x="130" y="0" width="120" height="10" rx="5"/></clipPath>
    <g clip-path="url(#bar2)"><rect x="90" y="0" width="40" height="10" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" values="0 0;160 0;160 0" keyTimes="0;0.2;1" dur="9s" begin="2.6s" repeatCount="indefinite"/>
    </rect></g>
    <text x="336" y="10" font-size="11" font-weight="600" text-anchor="end" fill="#f3ece8">4<tspan fill="#8a86a3" font-weight="400" dx="5">40%</tspan></text>
  </g>
  <g transform="translate(0,130)">
    <text x="24" y="10" font-size="12" font-weight="600" fill="#f3ece8">Night</text>
    <text x="84" y="10" font-size="10" fill="#8a86a3">00–06</text>
    <rect x="130" y="0" width="150" height="10" rx="5" fill="#2a2836"/>
    <rect x="130" y="0" width="0" height="10" rx="5" fill="#9a8fe0">
      <animate attributeName="width" values="0;6" dur="0.9s" begin="0.47s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    </rect>
    <text x="336" y="10" font-size="11" font-weight="600" text-anchor="end" fill="#f3ece8">0<tspan fill="#8a86a3" font-weight="400" dx="5">0%</tspan></text>
  </g>

  <text x="24" y="166" font-size="10" fill="#8a86a3">last push 06:04 JST</text>
  <text x="336" y="166" font-size="10" text-anchor="end" fill="#8a86a3">updated 10-29 16:09</text>
  </g>
</svg>
