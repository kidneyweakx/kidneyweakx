<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="kidneyweakx — software engineer in Tokyo">
  <title>kidneyweakx</title>

  <!-- Palette lifted from the avatar: dusk wall, hoodie ink, hair streaks, eyes. -->
  <defs>
    <clipPath id="card"><rect width="900" height="200" rx="16"/></clipPath>
    <clipPath id="wipe">
      <rect class="wipe" x="40" y="60" width="560" height="90"/>
    </clipPath>
  </defs>

  <style><![CDATA[
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; }

    /* the name is revealed left to right, like a pen stroke */
    @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .wipe { transform-origin: 40px 0; animation: wipe 900ms cubic-bezier(.65,0,.35,1) 150ms both; }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .rise   { animation: rise 700ms cubic-bezier(.22,1,.36,1) both; }
    .rise-1 { animation-delay: 700ms; }
    .rise-2 { animation-delay: 850ms; }

    /* sleeve stripes draw in once, then sway a few pixels */
    @keyframes draw { from { stroke-dashoffset: 520; } to { stroke-dashoffset: 0; } }
    .stripe { stroke-dasharray: 520; animation: draw 1100ms cubic-bezier(.65,0,.35,1) both; }
    .s-blue { animation-delay: 250ms; }
    .s-pink { animation-delay: 420ms; }
    @keyframes sway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-6px); } }
    .sleeve { animation: sway 7s ease-in-out 1.6s infinite; }

    /* heterochromia — red / green — blinks now and then */
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 6s ease-in-out 2s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .wipe, .rise, .stripe, .sleeve, .eyes { animation: none; }
    }
  ]]></style>

  <g clip-path="url(#card)">
    <rect width="900" height="200" fill="#403b66"/>
    <!-- hoodie hem along the bottom -->
    <rect y="184" width="900" height="16" fill="#1b1923"/>

    <g class="sleeve" fill="none" stroke-linejoin="miter" stroke-linecap="butt">
      <path class="stripe s-blue" d="M610 230 L735 105 L940 105" stroke="#3fb4d8" stroke-width="26"/>
      <path class="stripe s-pink" d="M660 230 L755 135 L940 135" stroke="#de5b94" stroke-width="16"/>
    </g>
  </g>

  <g class="sans">
    <g class="rise rise-1" fill="#c9c3e6" font-size="13" letter-spacing="2">
      <g class="eyes">
        <circle cx="47" cy="47" r="4" fill="#d0435a"/>
        <circle cx="61" cy="47" r="4" fill="#4f9e5a"/>
      </g>
      <text x="76" y="52">東京 · JST+9</text>
    </g>

    <g clip-path="url(#wipe)">
      <text x="40" y="128" font-size="70" font-weight="800" letter-spacing="-2" fill="#f3ece8">kidneyweakx</text>
    </g>

    <text class="rise rise-2" x="42" y="162" font-size="16" fill="#c9c3e6" letter-spacing=".5">software engineer — fullstack · iOS / Android · web3</text>
  </g>
</svg>
