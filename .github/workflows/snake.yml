name: Generate Snake

on:
  schedule:
    # every 12 hours (fallback in case no pushes happen)
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      # avoid re-running when only generated assets change
      - "assets/character.svg"
      - "assets/productive.svg"
      - "assets/now-playing.svg"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-dusk.svg?color_snake=%233fb4d8&color_dots=%2321202b,%23403b66,%236d63a8,%23de5b94,%233fb4d8

      - name: Push generated svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
